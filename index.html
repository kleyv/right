<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>right</title>
  </head>
  <body>
    <main>
      <div id="goal-sentence"></div>
      <div id="stats">
        <div id="timer">0</div>
        <div id="wpm">wpm</div>
      </div>
      <div id="debug" class="muted">
        <div id="wrong-chars-count">Wrong Chars: 0</div>
      </div>
      <div id="settings" class="muted">
        <form action="">
          <label for="mistake-mode">On mistake:</label>
          <select name="modes" id="mistake-mode">
            <option value="continue">continue</option>
            <option value="restartWord">restart word</option>
            <option value="stop">stop</option>
          </select>
        </form>
        <span>
          <kbd>Tab</kbd> to restart run.
        </span>
        <br>
        <details id="history-panel" class="muted">
          <summary>History</summary>
          <div id="history"></div>
        </details>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
